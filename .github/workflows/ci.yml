name: CI and VSIX

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements-dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r python/requirements-dev.txt
      - name: Check JavaScript syntax
        run: npm run check
      - name: Test extension
        run: npm test
      - name: Test Python engine
        run: PYTHONPATH=python python -m pytest python/tests -q
      - name: Package VSIX
        run: npx --yes @vscode/vsce package
      - uses: actions/upload-artifact@v4
        with:
          name: risk-workbench-vsix
          path: "*.vsix"
          if-no-files-found: error
          retention-days: 14
